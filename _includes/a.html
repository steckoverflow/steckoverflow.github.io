{%- comment -%} Opens an external link; adds // when the URL has no protocol. Caller closes </a>. {%- endcomment -%}
{%- assign protocol = include.href | strip | slice: 0, 4 -%}
<a href="{% if protocol != 'http' %}//{% endif %}{{ include.href }}" target="_blank"{% if include.class %} class="{{ include.class }}"{% endif %}{% if include.label %} aria-label="{{ include.label | escape }}"{% endif %}>
