content:
  - title: Experience 
    layout: list 
    content:
      - layout: left
        title: IKEA IT AB
        sub_title: Senior Software Engineer
        caption: December 2021 - Present
        quote: >
          IKEA taught me that human success comes not from individual strengths but effective collaboration.
        description: | 
            I joined IKEA as a systems engineer responsible for setting up and managing the brand-new <mark>Enterprise Metadata Catalog</mark>. During this period, IKEA was transitioning from on-premises infrastructure to a <mark>cloud-native</mark> operating model. I contributed to modernising engineering practices, including <mark>Infrastructure as Code</mark> and <mark>event-driven architecture</mark>.
            I worked in a rapidly changing and uncertain environment, solving ambiguous technical and organisational problems while continuously learning new tools and technologies. This fast-changing environment continues today as the team explores and develops agentic AI solutions. I am currently integrating <mark>Atlan</mark> with <mark>Databricks</mark>.

            Key achievements
            - Mentored and tutored more than 150 junior engineers in test-driven development during a nine-week training programme called the 'Native Clouders Bootcamp'
            - Certifying twice as a GCP Cloud Developer
            - Participated in high-level vendor and contract negotiations
            - Became a trusted and central contributor to the Data Catalog team

      - layout: left
        title: Stretch 
        link: https://www.stretch.se/
        sub_title: BI Consultant / Fullstack Developer / Cloud Engineer
        caption: May 2017 - November 2021
        quote: >
          At Stretch I learned subject mastery requires an open mind and constant re-training. Enjoy the process and you'll enjoy the work.
        description: | 
            During my time at Stretch, I worked as a consultant in business intelligence, analytics, and data warehousing within the energy and nuclear industries. I also developed applications using Vue and C#, and built data pipelines for customers across multiple industries.

      - layout: left
        title: Hypergene
        link: https://www.hypergene.com/sv
        sub_title: Business Intelligence Consultant 
        caption: August 2014 - May 2017
        quote: >
          Hypergene showed me that executives can be humble. The company welcomed me at the beginning of my career and helped shape who I am today.
        description: | 
            Hypergene was an incredibly fast-growing company full of senior talent. I was the first person they hired directly from university and learned a lot from being mentored.
            As a consultant at Hypergene, I installed, adapted, and developed their highly innovative analytics software. I met people across many industries in both the private and public sectors.

            Key achievements
            - Built a budgeting and forecasting tool for one of Sweden's largest real estate companies
