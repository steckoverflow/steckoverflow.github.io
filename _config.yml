about_content: | 
  Hi, my name's Thomas and I currently work as a senior software engineer at IKEA, although, I'd prefer to describe myself as somewhat of a <mark>computer generalist</mark>.

  I have been making things with computers since an early age. Over the years I've worked in various industries and roles, including business intelligence, data warehousing, systems administration, cloud platforms and full-stack development. I'm not a lone wolf. I thrive in collaborative teams and love discussing problems, pair programming, staying curious, keeping an open mind and learning.

  I am a two times certified: <mark>Google Cloud Platform Developer</mark> and most skilled with <mark>Python</mark>.

